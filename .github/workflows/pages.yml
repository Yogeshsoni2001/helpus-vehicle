name: Deploy HelpUs website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Android app
        working-directory: mobile_app
        run: flutter build apk --release
      - name: Prepare website files
        run: |
          mkdir -p _site/downloads
          cp index.html styles.css platform.css app.js supabase-config.js scanner.html scanner.css scanner.js _site/
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk _site/downloads/HelpUs.apk
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
